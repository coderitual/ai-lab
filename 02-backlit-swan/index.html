<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#040a0a" />
    <title>Backlit Swan</title>
    <meta name="description" content="A mute swan on a dark forest pond, backlit by low sun. An interactive real-time scene." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Backlit Swan" />
    <meta property="og:description" content="A mute swan on a dark forest pond, backlit by low sun. An interactive real-time scene that runs in the browser, on phones too." />
    <meta property="og:image" content="%VITE_SITE_URL%og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #040a0a;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        /* a long press on the picture should not select it or raise the callout */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #scene {
        position: absolute;
        inset: 0;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 14px;
        padding: 24px;
        background: #040a0a;
        color: #cfd8d2;
        font: 500 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-align: center;
      }
      /* the small print of a failure notice: a driver's own words, as they came */
      #loading small {
        max-width: 100%;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0;
        text-transform: none;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="loading">Loading…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
