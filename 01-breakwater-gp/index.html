<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0c2a3b" />
    <title>Breakwater GP</title>
    <meta name="description" content="An original jet-ski slalom race on simulated waves. Three laps, three rivals, keyboard or touch." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Breakwater GP" />
    <meta property="og:description" content="A jet-ski slalom race on simulated waves. Three laps, three rivals. Plays in the browser, on phones too." />
    <meta property="og:image" content="%VITE_SITE_URL%og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,500;1,600;1,700;1,800&display=swap" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c2a3b;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #fff8ea;
        font: italic 600 22px/1.3 'Barlow Condensed', 'Avenir Next Condensed', 'Arial Narrow', system-ui, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">Launching…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
