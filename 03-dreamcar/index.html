<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#07090c" />
    <title>Dreamcar</title>
    <meta name="description" content="A time trial over a mountain pass in a silver saloon, by day or by night. Solo or two-player split screen; keyboard, gamepad or touch." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dreamcar" />
    <meta property="og:description" content="A time trial over a mountain pass in a silver saloon, by day or by night. Plays in the browser, on phones too." />
    <meta property="og:image" content="%VITE_SITE_URL%og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07090c;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      /* the loading veil: the name and a thin line that runs while the world is built; it fades when the first frame is up */
      #loading {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        padding: 24px;
        background: #07090c;
        color: #dfe7ee;
        font: 200 clamp(26px, 6vmin, 52px) / 1 -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Roboto, Inter,
          system-ui, sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-align: center;
        transition: opacity 0.5s ease;
      }
      #loading.gone {
        opacity: 0;
        pointer-events: none;
      }
      #loading i {
        display: block;
        width: min(220px, 50vw);
        height: 1px;
        background: linear-gradient(90deg, transparent, #93dcff, transparent) no-repeat;
        background-size: 40% 100%;
        animation: loading-run 1.4s ease-in-out infinite;
      }
      #loading p {
        margin: 0;
        max-width: 26em;
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 0.04em;
        text-transform: none;
        color: #9aa6b1;
      }
      @keyframes loading-run {
        from {
          background-position: -60% 0;
        }
        to {
          background-position: 160% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading i {
          animation: none;
          background-size: 100% 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading" aria-live="polite"><span>Dreamcar</span><i></i></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
