<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sound bench</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #07090c;
        color: #c9ced6;
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: 190px 1fr;
        gap: 12px;
        padding: 12px;
      }
      #bench div {
        display: flex;
        gap: 4px;
        margin-bottom: 4px;
      }
      button {
        flex: 1;
        padding: 7px 8px;
        border: 1px solid #2a323d;
        border-radius: 4px;
        background: #121820;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      button.quiet {
        flex: 0;
        color: #7d8794;
      }
      button:hover {
        background: #1b2430;
      }
      canvas {
        display: block;
        width: 100%;
        max-width: 1280px;
        margin-bottom: 8px;
        border: 1px solid #1b2129;
      }
      #status {
        margin-bottom: 8px;
        min-height: 1.4em;
        color: #9aa4b1;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="bench"></div>
      <div>
        <div id="status"></div>
        <canvas id="scope" width="1280" height="220"></canvas>
        <canvas id="picture" width="1280" height="640"></canvas>
      </div>
    </main>
    <script type="module" src="/src/sounddev.js"></script>
  </body>
</html>
