<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#07090c" />
    <title>Serpentine</title>
    <meta name="description" content="A time trial over a mountain pass in a silver saloon, by day or by night. Solo or two-player split screen; keyboard, gamepad or touch." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Serpentine" />
    <meta property="og:description" content="A time trial over a mountain pass in a silver saloon, by day or by night. Plays in the browser, on phones too." />
    <meta property="og:image" content="%VITE_SITE_URL%og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07090c;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #07090c;
        color: #c9ced6;
        font: 500 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">Loading…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
